<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — TextoZen</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-body">
  <a class="brand auth-brand" href="/"><span>✦</span> TextoZen</a>
  <main class="auth-wrap"><section class="auth-card">
    <div class="eyebrow">BEM-VINDO DE VOLTA</div><h1>Entre na sua conta</h1><p>Continue acompanhando sua evolução.</p>
    <div class="alert error" th:if="${param.erro}">E-mail ou senha inválidos. Confira os dados e tente novamente.</div>
    <div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <form method="post" th:action="@{/login}">
      <label>E-mail<input type="email" name="username" autocomplete="email" placeholder="voce@email.com" required autofocus></label>
      <label>Senha<input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <button type="submit" class="btn primary full">Entrar →</button>
    </form>
    <p class="auth-foot">Ainda não tem conta? <a href="/cadastro">Cadastre-se grátis</a></p>
  </section></main>
</body></html>
